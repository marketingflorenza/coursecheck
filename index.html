<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard คอร์สคงเหลือ | Florenza Clinic รามอินทรา</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--primary:#7c4dff;--accent:#00b894;--warn:#e17055;--bg:#f4f6fb;--card:#fff;--text:#2d3436;--muted:#636e72;--border:#dfe6e9;--shadow:0 4px 20px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Kanit',sans-serif;background:var(--bg);color:var(--text);padding:16px;font-size:14px}
.container{max-width:1300px;margin:0 auto}
header{text-align:center;margin-bottom:20px}
header h1{font-size:1.7rem;font-weight:600;color:#1e272e}
header p{color:var(--muted);font-weight:300;font-size:.9rem;margin-top:4px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.stat-card.green{border-left-color:var(--accent)}
.stat-card.orange{border-left-color:var(--warn)}
.stat-card.purple{border-left-color:#a29bfe}
.stat-label{font-size:.78rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.stat-value{font-size:1.6rem;font-weight:600;margin-top:4px;color:#1e272e}
.stat-sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.filters-card{background:var(--card);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.filter-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.search-box{flex:1;min-width:160px;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;outline:none;transition:.2s}
.search-box:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,77,255,.1)}
.tag-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tag-label{font-size:.78rem;font-weight:600;color:#4b6584}
.tag{background:#f1f3f9;border:1.5px solid var(--border);padding:5px 13px;border-radius:20px;font-size:12px;cursor:pointer;transition:.2s;color:var(--muted);font-family:inherit;font-weight:500}
.tag:hover{border-color:var(--primary);color:var(--primary)}
.tag.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(124,77,255,.25)}
.table-wrap{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.table-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.table-header span{font-weight:600;font-size:.95rem;color:#1e272e}
.table-header small{color:var(--muted);font-size:.82rem}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:880px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #f0f0f0;font-size:13px}
th{background:#f8f9fd;font-weight:600;color:#4b6584;font-size:.75rem;text-transform:uppercase;letter-spacing:.4px}
th:last-child,td:last-child{text-align:center}
th:nth-child(5),td:nth-child(5){text-align:right}
tbody tr:hover{background:#f9f9ff}
.cust-name{font-weight:600;color:#1e272e;display:block}
.cust-meta{color:var(--muted);font-size:.8rem;display:block;margin-top:2px}
.badge{background:#ede7ff;color:var(--primary);padding:3px 10px;border-radius:12px;font-weight:600;font-size:12px}
.subtotal{background:#fafbff;font-weight:600}
.subtotal td{border-top:2px solid #ede7ff;color:var(--primary);font-size:.88rem}
.no-results{text-align:center;padding:40px;color:var(--muted);font-style:italic}
.btn-export{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:500;font-size:13px;transition:.2s;display:flex;align-items:center;gap:6px}
.btn-export:hover{background:#00a383;transform:translateY(-1px)}
.highlight-summary{background:linear-gradient(135deg,var(--primary),#a29bfe);color:#fff;border-radius:14px;padding:18px 24px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 20px rgba(124,77,255,.2)}
.hs-label{font-weight:400;font-size:.9rem;opacity:.9}
.hs-value{font-size:1.8rem;font-weight:600;letter-spacing:-.5px}
.hs-count{font-size:.85rem;opacity:.85;margin-top:2px}
@media(max-width:768px){.stats-grid{grid-template-columns:1fr 1fr}.filter-row{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏥 Dashboard คอร์สคงเหลือ</h1>
    <p>Florenza Clinic สาขา รามอินทรา — ข้อมูล ณ วันที่ประมวลผล</p>
  </header>

  <div class="stats-grid" id="stats-grid">
    <div class="stat-card"><div class="stat-label">ยอดเงินคงเหลือรวม</div><div class="stat-value" id="s-total">-</div><div class="stat-sub">บาท</div></div>
    <div class="stat-card green"><div class="stat-label">จำนวนลูกค้า</div><div class="stat-value" id="s-cust">-</div><div class="stat-sub">ราย</div></div>
    <div class="stat-card orange"><div class="stat-label">จำนวนคอร์ส</div><div class="stat-value" id="s-items">-</div><div class="stat-sub">รายการ</div></div>
    <div class="stat-card purple"><div class="stat-label">ยอดสูงสุด (ต่อคน)</div><div class="stat-value" id="s-max">-</div><div class="stat-sub" id="s-max-name"></div></div>
  </div>

  <div class="filters-card">
    <div class="filter-row">
      <input type="text" id="q-search" class="search-box" placeholder="🔍 ค้นหาลูกค้า (ชื่อ, HN, เบอร์โทร)">
      <input type="text" id="q-item" class="search-box" placeholder="🏷️ ค้นหาคอร์ส (Botox, Drip, IPL...)">
      <select id="q-month" class="search-box" style="min-width:150px">
        <option value="0">📅 ช่วงเวลา: ทั้งหมด</option>
        <option value="1">ย้อนหลัง 1 เดือน</option>
        <option value="3">ย้อนหลัง 3 เดือน</option>
        <option value="6">ย้อนหลัง 6 เดือน</option>
        <option value="12">ย้อนหลัง 12 เดือน</option>
      </select>
      <select id="q-sort" class="search-box" style="min-width:180px">
        <option value="date_desc">🕒 วันที่: ล่าสุดก่อน</option>
        <option value="date_asc">🕒 วันที่: เก่าสุดก่อน</option>
        <option value="amount_desc">💰 ยอดเงิน: มากไปน้อย</option>
        <option value="amount_asc">💰 ยอดเงิน: น้อยไปมาก</option>
      </select>
    </div>
    <div class="tag-row">
      <span class="tag-label">ตัวกรองด่วน:</span>
      <button class="tag" data-kw="filler|ฟิลเลอร์">Filler</button>
      <button class="tag" data-kw="botox|โบท็อก">Botox</button>
      <button class="tag" data-kw="pico|พิโก">Pico</button>
      <button class="tag" data-kw="ultraformer|อัลตร้า">Ultraformer</button>
      <button class="tag" data-kw="dio laser|diode|ไดโอด">Diode/Dio</button>
      <button class="tag" data-kw="hifu|ไฮฟู">Hifu</button>
      <button class="tag" data-kw="drip|วิตามิน">Drip</button>
      <button class="tag" data-kw="ipl">IPL</button>
      <button class="tag" data-kw="cryo">Cryo</button>
      <button class="tag" data-kw="co2">CO2</button>
    </div>
  </div>

  <div class="highlight-summary">
    <div>
      <div class="hs-label">ยอดเงินรวมคงเหลือที่กรอง</div>
      <div class="hs-value" id="hs-total">฿0</div>
      <div class="hs-count" id="hs-count">0 รายการ / 0 ลูกค้า</div>
    </div>
    <button class="btn-export" id="btn-export">📊 ส่งออก Excel</button>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <span>รายการคอร์สคงเหลือ</span>
      <small id="result-count"></small>
    </div>
    <div class="tbl-scroll">
      <table>
        <thead><tr>
          <th>#</th><th>วันที่</th><th>ข้อมูลลูกค้า</th><th>รายการคอร์ส</th><th style="text-align:right">คงเหลือ (฿)</th><th>ครั้งคงเหลือ</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

let activeTags = new Set();
let filtered = [];

// Parse dates
RAW.forEach(d => {
  const p = d.date.split(/[\/ :]/);
  d.dateObj = new Date(+p[2], +p[0]-1, +p[1]);
  d.dateDisplay = d.dateObj.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'});
});

function debounce(f,w){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),w)}}

document.querySelectorAll('.tag').forEach(b => {
  b.addEventListener('click',()=>{
    const kw = b.dataset.kw;
    if(activeTags.has(kw)){activeTags.delete(kw);b.classList.remove('active')}
    else{activeTags.add(kw);b.classList.add('active')}
    render();
  });
});

['q-search','q-item','q-month','q-sort'].forEach(id=>{
  const el = document.getElementById(id);
  el.addEventListener('change', render);
  el.addEventListener('input', debounce(render,250));
});

function applyFilters(){
  let r=[...RAW];
  const q=document.getElementById('q-search').value.toLowerCase().trim();
  if(q) r=r.filter(d=>d.name.toLowerCase().includes(q)||d.hn.toLowerCase().includes(q)||d.phone.includes(q));
  const qi=document.getElementById('q-item').value.toLowerCase().trim();
  if(qi) r=r.filter(d=>d.item.toLowerCase().includes(qi));
  if(activeTags.size>0){
    r=r.filter(d=>{
      const nm=d.item.toLowerCase();
      return [...activeTags].some(kw=>kw.split('|').some(k=>nm.includes(k)));
    });
  }
  const mo=parseInt(document.getElementById('q-month').value);
  if(mo>0){
    const cutoff=new Date();cutoff.setMonth(cutoff.getMonth()-mo);
    r=r.filter(d=>d.dateObj>=cutoff);
  }
  return r;
}

function groupAndSort(data){
  const groups={};
  data.forEach(d=>{
    const k=d.hn+d.name;
    if(!groups[k]) groups[k]={name:d.name,hn:d.hn,phone:d.phone,items:[],total:0,latest:d.dateObj};
    groups[k].items.push(d);
    groups[k].total+=d.amount;
    if(d.dateObj>groups[k].latest) groups[k].latest=d.dateObj;
  });
  const arr=Object.values(groups);
  const sv=document.getElementById('q-sort').value;
  arr.sort((a,b)=>{
    if(sv==='amount_desc') return b.total-a.total;
    if(sv==='amount_asc') return a.total-b.total;
    if(sv==='date_asc') return a.latest-b.latest;
    return b.latest-a.latest;
  });
  return arr;
}

function fmt(n){return n.toLocaleString('th-TH',{minimumFractionDigits:2})}

function render(){
  filtered=applyFilters();
  const groups=groupAndSort(filtered);
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  
  let grand=0, idx=1;
  groups.forEach(g=>{
    grand+=g.total;
    g.items.forEach((it,i)=>{
      const tr=document.createElement('tr');
      if(i===0) tr.innerHTML+=`<td rowspan="${g.items.length}" style="text-align:center;vertical-align:top;font-weight:600;color:#4b6584">${idx}</td>`;
      tr.innerHTML+=`<td style="color:var(--muted);font-size:12px;white-space:nowrap">${it.dateDisplay}</td>`;
      if(i===0) tr.innerHTML+=`<td rowspan="${g.items.length}" style="border-left:3px solid var(--primary);padding-left:12px;vertical-align:top"><span class="cust-name">${g.name}</span><span class="cust-meta">HN: ${g.hn} | ☎ ${g.phone}</span></td>`;
      tr.innerHTML+=`<td>${it.item}</td>`;
      tr.innerHTML+=`<td style="text-align:right;font-weight:500">${fmt(it.amount)}</td>`;
      tr.innerHTML+=`<td><span class="badge">${it.remaining}</span></td>`;
      tbody.appendChild(tr);
    });
    const st=document.createElement('tr');
    st.className='subtotal';
    st.innerHTML=`<td colspan="3" style="text-align:right;padding-right:16px">ยอดคงเหลือรวม:</td><td style="text-align:right">฿${fmt(g.total)}</td><td></td>`;
    tbody.appendChild(st);
    idx++;
  });

  if(groups.length===0) tbody.innerHTML='<tr><td colspan="6" class="no-results">ไม่พบข้อมูลตามเงื่อนไขที่เลือก</td></tr>';

  // Update summary
  document.getElementById('hs-total').textContent='฿'+fmt(grand);
  document.getElementById('hs-count').textContent=`${filtered.length} รายการ / ${groups.length} ลูกค้า`;
  document.getElementById('result-count').textContent=`แสดง ${groups.length} ลูกค้า / ${filtered.length} คอร์ส`;
  updateStats(groups,grand);
}

function updateStats(groups,grand){
  document.getElementById('s-total').textContent='฿'+Math.round(grand).toLocaleString('th-TH');
  const allRaw=applyFilters();
  const g2=groupAndSort(allRaw);
  document.getElementById('s-cust').textContent=groups.length.toLocaleString();
  document.getElementById('s-items').textContent=filtered.length.toLocaleString();
  const top=groups.reduce((a,b)=>b.total>a.total?b:a,{total:0,name:''});
  document.getElementById('s-max').textContent=top.total?'฿'+Math.round(top.total).toLocaleString('th-TH'):'-';
  document.getElementById('s-max-name').textContent=top.name||'';
}

document.getElementById('btn-export').addEventListener('click',()=>{
  const groups=groupAndSort(filtered);
  const rows=[['ลำดับ','วันที่','ชื่อลูกค้า','HN','เบอร์โทร','รายการคอร์ส','คงเหลือ (บาท)','ครั้งคงเหลือ']];
  let grand=0;
  groups.forEach((g,idx)=>{
    grand+=g.total;
    g.items.forEach((it,i)=>{
      rows.push([i===0?idx+1:'',it.dateDisplay,i===0?g.name:'',i===0?g.hn:'',i===0?g.phone:'',it.item,it.amount,it.remaining]);
    });
    rows.push(['','','','','','ยอดคงเหลือรวมของลูกค้าท่านนี้:',g.total,'']);
    rows.push([]);
  });
  rows.push(['','','','','','ยอดเงินรวมทั้งหมด:',grand,'']);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:6},{wch:14},{wch:24},{wch:13},{wch:14},{wch:40},{wch:18},{wch:12}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'คอร์สคงเหลือ');
  XLSX.writeFile(wb,'Florenza_Export_'+new Date().toISOString().slice(0,10)+'.xlsx');
});

render();
</script>
